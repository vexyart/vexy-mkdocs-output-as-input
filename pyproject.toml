# this_file: pyproject.toml

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "vexy-mkdocs-output-as-input"
dynamic = ["version"]
description = "MkDocs plugin that captures HTML output and creates cousin Markdown files with original frontmatter"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [
    {name = "Vexy Lines Team", email = "help@vexy.art"},
]
maintainers = [
    {name = "Vexy Lines Team", email = "help@vexy.art"},
]
keywords = ["mkdocs", "plugin", "documentation", "html", "markdown", "postprocessing"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: MkDocs",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Documentation",
    "Topic :: Software Development :: Documentation",
    "Topic :: Text Processing :: Markup :: HTML",
    "Topic :: Text Processing :: Markup :: Markdown",
]
dependencies = [
    "mkdocs>=1.6.0",
    "beautifulsoup4>=4.12.0",
    "pyyaml>=6.0",
    "loguru>=0.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.11.0",
    "ruff>=0.1.0",
    "black==24.10.0",  # pinned to match the pre-commit black hook so CI and pre-commit never disagree
    "mypy>=1.5.0",
    "pre-commit>=3.3.0",
    "types-pyyaml>=6.0.0",
    "types-beautifulsoup4>=4.12.0",
    "twine>=4.0.0",
    "pyinstaller>=6.0.0",
]
docs = [
    "vexy-mkdocs-material>=9.4.0",
    "mkdocstrings[python]>=0.24.0",
]

[project.urls]
Homepage = "https://github.com/vexyart/vexy-mkdocs-output-as-input"
Documentation = "https://github.com/vexyart/vexy-mkdocs-output-as-input"
Repository = "https://github.com/vexyart/vexy-mkdocs-output-as-input"
Issues = "https://github.com/vexyart/vexy-mkdocs-output-as-input/issues"
Changelog = "https://github.com/vexyart/vexy-mkdocs-output-as-input/blob/main/CHANGELOG.md"

[project.entry-points."mkdocs.plugins"]
output-as-input = "mkdocs_output_as_input.plugin:OutputAsInputPlugin"

[project.scripts]
mkdocs-output-as-input = "mkdocs_output_as_input.cli:main"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/mkdocs_output_as_input/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/mkdocs_output_as_input"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/README.md",
    "/CHANGELOG.md",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "ARG", # flake8-unused-arguments
    "PIE", # flake8-pie
    "PL",  # pylint
    "RUF", # ruff-specific rules
]
ignore = [
    "PLR0913", # Too many arguments
    "PLR2004", # Magic value used in comparison
    "PLR0912", # Too many branches (HTML extraction is inherently branchy)
    "PLR0915", # Too many statements (single-pass file processor)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
    "S101",    # Allow assert in tests
    "ARG002",  # pytest fixtures are referenced by name, not always used in-body
    "PLC0415", # Deliberate in-function imports to exercise import paths
    "PLW1510", # subprocess.run without explicit check is fine in tests
]

[tool.black]
line-length = 100
target-version = ['py312']

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = "mkdocs.*"
ignore_missing_imports = true

# _version.py is generated by hatch-vcs at build time; tolerate its absence
# when type-checking a fresh checkout before the build hook has run.
[[tool.mypy.overrides]]
module = "mkdocs_output_as_input._version"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.coverage.run]
source = ["src/mkdocs_output_as_input"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 90
