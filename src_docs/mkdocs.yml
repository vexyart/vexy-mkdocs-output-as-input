# this_file: src_docs/mkdocs.yml
site_name: vexy-mkdocs-output-as-input
site_description: MkDocs plugin that captures HTML output and creates cousin Markdown files with original frontmatter
site_url: https://vexy.dev/vexy-mkdocs-output-as-input/
repo_url: https://github.com/vexyart/vexy-mkdocs-output-as-input
repo_name: vexyart/vexy-mkdocs-output-as-input
edit_uri: edit/main/src_docs/md/
docs_dir: md
site_dir: ../docs
use_directory_urls: true
theme:
  name: materialx
  logo: assets/icon.png
  favicon: assets/icon.png
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.highlight
    - content.code.copy
    - content.code.annotate
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle: {icon: material/brightness-7, name: Switch to dark mode}
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle: {icon: material/brightness-4, name: Switch to light mode}
markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc: {permalink: true}
  - pymdownx.details
  - pymdownx.highlight: {anchor_linenums: true}
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.superfences
  - pymdownx.tabbed: {alternate_style: true}
  - pymdownx.tasklist: {custom_checkbox: true}
plugins:
  - materialx/meta
  - materialx/tags
  - awesome-nav
  - autorefs
  - mkdocstrings:
      handlers:
        python:
          paths: [../src]
          options:
            allow_inspection: false
            docstring_style: null
            show_root_heading: true
            show_source: true
  - materialx/search
